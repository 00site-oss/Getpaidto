<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullscreen Iframe</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100vw;
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>
  <iframe
    src="https://script.google.com/macros/s/AKfycbwNCn-zsMRhQk8votZtRHKhFd3wu0kNCwpNSooJ8ehaWgNHFYw__MmAPGLOIM-iJUE7/exec"
    title="Apps Script App"
    allow="fullscreen"
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>
</body>
</html>
