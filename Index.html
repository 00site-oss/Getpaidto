<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Full Screen App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f5f5f5; 
    }

    /* dvh and dvw fix the mobile address bar issue */
    iframe {
      display: block;
      width: 100vw;
      width: 100dvw; 
      height: 100vh;
      height: 100dvh;
      border: none;
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <iframe
    src="https://script.google.com/macros/s/AKfycbwNCn-zsMRhQk8votZtRHKhFd3wu0kNCwpNSooJ8ehaWgNHFYw__MmAPGLOIM-iJUE7/exec"
    title="Apps Script App"
    allow="fullscreen"
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>
</body>
</html>
